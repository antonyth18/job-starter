<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; }
      li { border: 1px solid #ddd; border-radius: 8px; list-style: none; margin: 8px 0; padding: 12px; }
      ul { padding: 0; }
      input { font-size: 16px; padding: 8px; width: 100%; box-sizing: border-box; }
      li { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
      button { cursor: pointer; flex-shrink: 0; font-size: 14px; padding: 6px 12px; }
      button:disabled { cursor: default; }
      .empty { color: #666; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Jobs</h1>
    <p id="error" class="error" role="alert" hidden></p>
    <h2>Saved jobs</h2>
    <p id="saved-empty" class="empty">No saved jobs yet. Press Save on a job below.</p>
    <ul id="saved"></ul>
    <h2>All jobs</h2>
    <input id="search" placeholder="Search by title, company or place" aria-label="Search jobs" />
    <ul id="jobs"></ul>
    <script type="module" src="/app.js"></script>
  </body>
</html>
